name: Release integrity

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated tag to verify
        required: true
        default: v1.0.0

permissions:
  contents: read

concurrency:
  group: release-integrity-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  integrity:
    name: Verify production release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Verify references and versions
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin production --tags --force
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          tagged_sha="$(git rev-parse "$RELEASE_TAG^{}")"
          production_sha="$(git rev-parse origin/production)"
          head_sha="$(git rev-parse HEAD)"
          test "$tagged_sha" = "$production_sha"
          test "$tagged_sha" = "$head_sha"
          grep -Fq "VERSION $version" CMakeLists.txt
          grep -Fq "info.version = \"$version\"" src/runtime/version.cpp

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Re-run release quality gate
        run: bun run ci
